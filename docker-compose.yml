version: '3.8'

services:
  quran-app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./web:/app/web
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/translations"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
